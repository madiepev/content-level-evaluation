<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A guided Microsoft Foundry learning and credential discovery simulation."
    />
    <title>Guided Microsoft Foundry discovery</title>
    <link rel="stylesheet" href="../shared-theme.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <main id="main">
      <section id="route-view" class="view route-view" aria-labelledby="route-title">
        <div class="page-heading">
          <h1 id="route-title" tabindex="-1">How would you like to get started?</h1>
          <p>Explore learning by the work you want to do, or prepare for a Microsoft credential.</p>
        </div>

        <div class="choice-grid route-grid">
          <button class="choice-card route-card" type="button" data-mode="tasks">
            <span class="line-icon" aria-hidden="true">
              <svg viewBox="0 0 32 32">
                <path d="M7 9h18M7 16h18M7 23h18M4 9h.1M4 16h.1M4 23h.1" />
              </svg>
            </span>
            <span class="choice-copy">
              <strong>Explore task-based paths</strong>
              <small>Choose learning based on what you want to accomplish with AI.</small>
              <ul>
                <li>Build AI apps and agents</li>
                <li>Govern and secure AI solutions</li>
                <li>Operate and evaluate AI systems</li>
              </ul>
              <span class="card-action">View task-based paths <b aria-hidden="true">→</b></span>
            </span>
          </button>

          <button class="choice-card route-card" type="button" data-mode="credentials">
            <span class="line-icon" aria-hidden="true">
              <svg viewBox="0 0 32 32">
                <circle cx="16" cy="12" r="7" />
                <path d="m12 18-2 10 6-3 6 3-2-10" />
              </svg>
            </span>
            <span class="choice-copy">
              <strong>Work toward a credential</strong>
              <small>Prepare for a Foundry-related Microsoft Certification or Applied Skill.</small>
              <ul>
                <li>Role-based certification exams</li>
                <li>Focused, scenario-based assessments</li>
                <li>Credentials you can share</li>
              </ul>
              <span class="card-action">View credentials <b aria-hidden="true">→</b></span>
            </span>
          </button>
        </div>

        <aside class="guidance">
          <strong>Not sure which option is right?</strong>
          <p>Start with a task you want to accomplish, then use a credential to validate what you know.</p>
        </aside>
      </section>

      <section id="results-view" class="view paths-view" aria-labelledby="results-title" hidden>
        <button class="back-button" type="button">
          <span aria-hidden="true">←</span> Back
        </button>
        <div class="page-heading">
          <h1 id="results-title" tabindex="-1"></h1>
          <p id="results-description"></p>
        </div>
        <div
          id="portfolio-toggle"
          class="portfolio-toggle"
          role="group"
          aria-label="Choose portfolio view"
          hidden
        >
          <button type="button" data-portfolio="current" aria-pressed="true">Current</button>
          <button type="button" data-portfolio="planned" aria-pressed="false">Planned</button>
        </div>

        <p id="loading-state" class="loading-state" hidden>Loading learning paths...</p>
        <div id="theme-list" class="theme-list"></div>
      </section>
    </main>

    <template id="theme-template">
      <section class="theme">
        <div class="theme-heading">
          <h2></h2>
          <p></p>
        </div>
        <div class="path-grid"></div>
      </section>
    </template>

    <template id="path-template">
      <a class="path-card" target="_blank" rel="noreferrer">
        <strong></strong>
        <em></em>
        <small></small>
        <span class="path-link"></span>
      </a>
    </template>

    <template id="planned-path-template">
      <section class="planned-path">
        <button class="planned-detail-back" type="button">
          <span aria-hidden="true">←</span> Back to planned paths
        </button>
        <div class="planned-path-heading">
          <div>
            <h2></h2>
            <p></p>
          </div>
          <span class="planned-module-count"></span>
        </div>
        <ol class="module-sequence"></ol>
      </section>
    </template>

    <template id="planned-card-template">
      <button class="path-card planned-path-card" type="button">
        <strong></strong>
        <em></em>
        <small></small>
        <span class="path-link">View planned path <b aria-hidden="true">→</b></span>
      </button>
    </template>

    <template id="module-template">
      <li>
        <article class="module-card">
          <span class="module-level"></span>
          <div>
            <h3></h3>
            <p></p>
          </div>
        </article>
      </li>
    </template>

    <script src="script.js"></script>
  </body>
</html>
